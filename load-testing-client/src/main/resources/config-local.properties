# ================================================
# LOCAL TESTING CONFIGURATION
# For testing with Docker containers on localhost
# ================================================

# Service URLs - Each service on different port
product.service.url=http://localhost:8082
shopping.cart.service.url=http://localhost:8084
credit.card.service.url=http://localhost:8080
warehouse.service.url=http://localhost:8083

# Load Test Parameters - SMALL TEST
total.checkouts=200000
items.per.cart=5
thread.count=12
max.retries=5

# Timeout Settings (milliseconds)
connection.timeout=10000
request.timeout=30000

# Output Settings
metrics.output.file=load_test_metrics_local.csv
results.output.file=load_test_results_local.txt

# RabbitMQ Management Console
rabbitmq.management.url=http://localhost:15672