# ================================================
# AWS DEPLOYMENT CONFIGURATION
# For testing with AWS Application Load Balancer
# ================================================

# Service URLs - All point to the same Load Balancer
# TODO: Update this URL after deploying your ALB
product.service.url=http://your-alb-name-123456789.us-west-2.elb.amazonaws.com
shopping.cart.service.url=http://your-alb-name-123456789.us-west-2.elb.amazonaws.com
credit.card.service.url=http://your-alb-name-123456789.us-west-2.elb.amazonaws.com
warehouse.service.url=http://your-alb-name-123456789.us-west-2.elb.amazonaws.com

# Load Test Parameters - FULL TEST
total.checkouts=200000
items.per.cart=5
thread.count=12
max.retries=5

# Timeout Settings (milliseconds) - Longer for network latency
connection.timeout=20000
request.timeout=60000

# Output Settings
metrics.output.file=load_test_metrics_aws.csv
results.output.file=load_test_results_aws.txt

# RabbitMQ Management Console (if deployed on AWS)
rabbitmq.management.url=http://your-rabbitmq-url.amazonaws.com:15672