# Server Configuration
server.port=8084
spring.application.name=shopping-cart-service

# Actuator endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:shoppingcartdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (for debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# External Service URLs
# Use localhost for local development, container names for Docker
services.product.url=${SERVICES_PRODUCT_URL:http://localhost:8082}
services.credit-card-authorizer.url=${SERVICES_CREDIT_CARD_AUTHORIZER_URL:http://localhost:8080}


# Logging
logging.level.com.cs6650.shoppingcart=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n