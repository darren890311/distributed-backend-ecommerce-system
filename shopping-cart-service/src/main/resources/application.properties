# Server Configuration
server.port=8084
spring.application.name=shopping-cart-service

# Actuator endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# External Service URLs
kvstore.leader.url=http://localhost:8080
services.product.url=http://localhost:8082
services.warehouse.url=http://localhost:9083
services.credit-card-authorizer.url=http://localhost:8085

# RabbitMQ Configuration
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Logging
logging.level.com.cs6650.shoppingcart=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n