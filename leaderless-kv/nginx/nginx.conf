# PID file location (needs write access)
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # Define upstream servers for the leaderless KV cluster
    # Round-robin is the default load balancing method
    upstream leaderless_cluster {
        # Round-robin distribution to all nodes
        server 10.245.222.64:8081;
        server 10.245.222.64:8082;
        server 10.245.222.64:8083;
        server 10.245.222.64:8084;
        server 10.245.222.64:8085;
    }

    # Logging
    access_log /tmp/nginx-access.log;
    error_log /tmp/nginx-error.log;

    server {
        listen 8080;

        # Health check endpoint
        location /health {
            proxy_pass http://leaderless_cluster/test/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Client write endpoint - round-robin to any node
        # That node becomes the Write Coordinator
        location /api/kv/set {
            proxy_pass http://leaderless_cluster/api/kv/set;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Increase timeout for write coordination (W=N requires all nodes)
            proxy_connect_timeout 10s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
        }

        # Client read endpoint - round-robin to any node
        # That node returns its local value (R=1)
        location /api/kv/get {
            proxy_pass http://leaderless_cluster/api/kv/get;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Timeout for reads with delay
            proxy_connect_timeout 5s;
            proxy_send_timeout 5s;
            proxy_read_timeout 5s;
        }

        # Test endpoint for local reads (for testing)
        location /test/local_read {
            proxy_pass http://leaderless_cluster/test/local_read;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
